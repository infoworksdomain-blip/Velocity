name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A real, previously-undiscovered gap: packages/providers' brand-
      # intelligence crawler (src/brand-intelligence/crawler.ts) launches
      # a real Chromium via the plain `playwright` package as part of
      # `pnpm test`'s real 20-site GATE 6 test — and nothing ever
      # installed the actual browser binary in CI. Invisible until this
      # workflow's first real run: every environment this suite had run
      # in before (including the sandbox that wrote it) already had
      # Chromium cached locally from unrelated Playwright work elsewhere
      # in the repo (apps/web's E2E suite). A genuinely fresh runner has
      # no such cache — `chromium.launch()` fails outright, and the whole
      # 20-site test fails at 0/20 rather than a partial/flaky result.
      - name: Install Playwright Chromium (packages/providers' brand-intelligence crawler)
        run: pnpm --filter @velocity/providers exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Dependency vulnerability scan
        # STEP 20 (build script: "dependency and container scanning in
        # CI"). continue-on-error: a moderate/low finding in a transitive
        # dep shouldn't block every PR the moment a new CVE is disclosed
        # upstream — high/critical findings are what GATE 20 cares about.
        # Container scanning is the `docker` job below, now that images
        # are actually built here.
        run: pnpm audit --audit-level=high
        continue-on-error: true

  docker:
    name: Build & publish container images
    needs: build
    # Only from a real push to the default branch — never from a PR
    # (untrusted branches, including forks, shouldn't get to publish an
    # image under this repo's name) and never speculatively on every
    # commit to a feature branch.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: velocity-web
            dockerfile: apps/web/Dockerfile
          - image: velocity-worker
            dockerfile: apps/worker/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Real, multi-stage Dockerfiles (apps/web/Dockerfile, apps/worker/
      # Dockerfile) built from the repo root — a pnpm workspace install
      # needs every package's manifest present in the build context, not
      # just the one app's own folder. GitHub-hosted runners ship Docker
      # by default, so this is also the first environment this build has
      # ever had that could actually run `docker build` for real — see
      # docs/audit/REMEDIATION.md's Unit 3 for why that was never
      # possible in the sandbox these Dockerfiles were originally written
      # and reviewed in.
      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # STEP 20's own "dependency AND container scanning" requirement —
      # the container half, closed now that there's an image to scan.
      # Non-blocking (continue-on-error), matching the dependency scan
      # step's own posture above: this surfaces findings in the build log
      # rather than failing every push the moment a new base-image CVE is
      # disclosed upstream.
      - name: Scan ${{ matrix.image }} for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table
