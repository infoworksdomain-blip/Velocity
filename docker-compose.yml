services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: velocity
      POSTGRES_PASSWORD: velocity
      POSTGRES_DB: velocity
    ports:
      - "5432:5432"
    volumes:
      - velocity_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: velocity
      MINIO_ROOT_PASSWORD: velocity_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - velocity_minio_data:/data

volumes:
  velocity_postgres_data:
  velocity_minio_data:
